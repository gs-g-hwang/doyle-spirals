name = "DoyleFormal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DoyleFormal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.header = false # Mathlib's copyright-header rule is not needed here

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "DoyleFormal"
